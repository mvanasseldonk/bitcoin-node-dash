name: Docker

# Pull requests: build the image and smoke-test it in mock mode.
# main:          also publish ghcr.io/<repo>:edge (linux/amd64 + linux/arm64).
# Tags v*:       also publish :<version>, :<major>.<minor> and :latest.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: node-dash:test
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name nd -p 8080:8080 -e NODEDASH_MOCK=healthy node-dash:test
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/api/status | tee /dev/stderr | grep -q '"level":"healthy"'
          curl -fsS http://localhost:8080/ | grep -q '<div id="app">'
          docker exec nd /usr/local/bin/node-dash healthcheck
          docker run --rm node-dash:test version
          docker image inspect node-dash:test --format 'Image size: {{.Size}} bytes'
          docker stats --no-stream nd
          docker logs nd
          docker rm -f nd

      - name: Image metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
