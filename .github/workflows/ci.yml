name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build frontend
        run: make web

      - name: Lint
        run: make lint

      - name: Test
        run: go test -race ./...

      - name: Build binary
        run: go build -trimpath -o bin/node-dash ./cmd/node-dash

  # install.sh on a real systemd host: install an older release, update,
  # re-run (no-op), keep a changed unit, node control, automatic updates,
  # uninstall. A fake
  # bitcoind service (perl renaming itself) lets the script detect the user and
  # data directory, and the dashboard restart it.
  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        run: shellcheck install.sh

      - name: Fake bitcoind
        run: |
          sudo useradd --create-home bitcoin
          sudo -u bitcoin mkdir -p /home/bitcoin/.bitcoin
          printf '%s\n' '[Service]' 'User=bitcoin' 'Restart=always' \
            'ExecStart=/usr/bin/perl -e "$$0 = q{/usr/local/bin/bitcoind -datadir=/home/bitcoin/.bitcoin}; sleep 3600"' |
            sudo tee /etc/systemd/system/bitcoind.service
          sudo systemctl daemon-reload
          sudo systemctl start bitcoind
          sleep 1
          ps -eo uid=,args= | grep '[b]itcoind'

      - name: Install an older release
        run: |
          VERSION=v0.1.0 sh install.sh
          test "$(node-dash version)" = v0.1.0
          systemctl is-active node-dash
          grep -x 'User=bitcoin' /etc/systemd/system/node-dash.service
          grep -x 'Environment=BITCOIN_DATADIR=/home/bitcoin/.bitcoin' /etc/systemd/system/node-dash.service
          curl -fsS http://127.0.0.1:8080/healthz

      - name: Update to the latest release
        run: |
          latest=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/${{ github.repository }}/releases/latest)
          latest=${latest##*/}
          sh install.sh | tee out.txt
          grep -q "Updating node-dash v0.1.0 → $latest" out.txt
          test "$(node-dash version)" = "$latest"
          systemctl is-active node-dash

      - name: Running again changes nothing
        run: |
          sh install.sh | tee out.txt
          grep -q 'already installed and up to date' out.txt

      - name: A changed unit is kept
        run: |
          sudo sed -i 's/^RestartSec=5$/RestartSec=7/' /etc/systemd/system/node-dash.service
          VERSION=v0.1.0 sh install.sh | tee out.txt
          grep -q 'Kept /etc/systemd/system/node-dash.service' out.txt
          grep -x 'RestartSec=7' /etc/systemd/system/node-dash.service
          test "$(node-dash version)" = v0.1.0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Node control
        run: |
          command -v pkaction || { sudo apt-get update && sudo apt-get install -y polkitd; }
          NODEDASH_CONTROL=1 sh install.sh | tee out.txt
          grep -q 'Node control is on' out.txt
          grep -q 'TimeoutStopSec=600' out.txt  # the fake unit has systemd's default of 90 s
          sudo grep -q 'subject.user === "bitcoin"' /etc/polkit-1/rules.d/50-node-dash.rules
          systemctl show -p Environment --value node-dash | grep -q 'NODEDASH_CONTROL=1'

          # The released binary predates node control: run this commit's build.
          mkdir -p web/dist && touch web/dist/index.html
          go build -o node-dash ./cmd/node-dash
          sudo install -m 0755 node-dash /usr/local/bin/node-dash
          sudo systemctl restart node-dash
          for _ in $(seq 10); do curl -fsS -o /dev/null http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/control | tee state.json; echo
          grep -q '"activeState":"active"' state.json

          post() {
            curl -s -o /dev/null -w '%{http_code}' -X POST "$@" http://127.0.0.1:8080/api/control
          }
          before=$(systemctl show -p MainPID --value bitcoind)
          # Refused: another site, and a plain form post.
          test "$(post -H 'Content-Type: application/json' -H 'Origin: http://evil.example' -d '{"action":"restart"}')" = 403
          test "$(post -d 'action=restart')" = 415
          sleep 2
          test "$(systemctl show -p MainPID --value bitcoind)" = "$before"

          # Accepted: systemd (allowed by polkit) restarts bitcoind.
          test "$(post -H 'Content-Type: application/json' -H 'Origin: http://127.0.0.1:8080' -d '{"action":"restart"}')" = 202
          for _ in $(seq 20); do
            after=$(systemctl show -p MainPID --value bitcoind)
            [ "$after" != "$before" ] && [ "$after" != 0 ] && systemctl is-active --quiet bitcoind && break
            sleep 1
          done
          test "$after" != "$before"
          systemctl is-active bitcoind

      # Still this commit's build: the server figures must be readable under
      # the hardening of node-dash.service, also while bitcoind has no RPC.
      - name: Server details under the service hardening
        run: |
          curl -fsS http://127.0.0.1:8080/api/details >/dev/null
          sleep 5
          curl -fsS http://127.0.0.1:8080/api/details | tee details.json; echo
          python3 - <<'EOF'
          import json
          d = json.load(open("details.json"))
          s = d["server"]
          assert d["nodeError"], "the fake bitcoind has no RPC"
          assert s["memTotalBytes"] > 0 and s["uptimeSec"] > 0 and s["diskTotalBytes"] > 0, s
          assert s["cpuPercent"] is not None, s
          assert set(s["missing"]) <= {"temperature"}, s["missing"]
          print("server details ok; missing:", s["missing"])
          EOF

      - name: Node control off again
        run: |
          NODEDASH_CONTROL=0 sh install.sh | tee out.txt
          grep -q 'Turning node control off' out.txt
          sudo test ! -e /etc/polkit-1/rules.d/50-node-dash.rules
          test ! -e /etc/systemd/system/node-dash.service.d/control.conf
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/control)" = 404

      # Automatic updates (story #50), from a fake release server on this
      # runner: this commit's build as v0.90.0 and v0.91.0, a v0.92.0 that
      # doesn't start, and a v0.93.0 signed with another key. The test
      # binaries carry a throwaway release key instead of the real one.
      - name: Automatic updates
        run: |
          set -eu
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign >/dev/null
          minisign -G -W -s ci.key -p ci.pub
          minisign -G -W -s other.key -p other.pub
          key=$(sed -n 2p ci.pub)
          build() {
            go build -ldflags "-X main.version=$1 -X github.com/mvanasseldonk/bitcoin-node-dash/internal/minisign.releaseKey=$key" \
              -o "$2" ./cmd/node-dash
          }
          # publish TAG BINARY [SIGNING KEY]: a release, and make it the latest.
          publish() {
            name=node-dash_$1_linux_amd64
            mkdir -p "srv/download/$1" "pkg/$name" srv/api
            cp "$2" "pkg/$name/node-dash"
            tar -czf "srv/download/$1/$name.tar.gz" -C pkg "$name"
            (cd "srv/download/$1" && sha256sum "$name.tar.gz" > checksums.txt)
            minisign -S -l -s "${3:-ci.key}" -m "srv/download/$1/checksums.txt" -t "node-dash $1"
            printf '{"tag_name":"%s"}\n' "$1" > srv/api/latest
          }
          status() { sudo cat /var/lib/node-dash/update.json; }

          build v0.90.0 old
          build v0.91.0 new
          publish v0.91.0 new
          python3 -m http.server --directory srv 8999 >/dev/null 2>&1 &
          sudo install -m 0755 old /usr/local/bin/node-dash
          sudo systemctl restart node-dash
          for _ in $(seq 10); do curl -fsS -o /dev/null http://127.0.0.1:8080/healthz && break; sleep 1; done
          sudo mkdir -p /etc/systemd/system/node-dash-update.service.d
          printf '%s\n' '[Service]' \
            'Environment=NODEDASH_UPDATE_API=http://127.0.0.1:8999/api/latest' \
            'Environment=NODEDASH_UPDATE_DOWNLOADS=http://127.0.0.1:8999/download' |
            sudo tee /etc/systemd/system/node-dash-update.service.d/ci.conf

          # Turning it on checks right away: v0.90.0 → v0.91.0.
          NODEDASH_AUTO_UPDATE=1 VERSION=v0.90.0 sh install.sh | tee out.txt
          grep -q 'Automatic updates are on' out.txt
          grep -q 'First check: updated' out.txt
          test "$(node-dash version)" = v0.91.0
          systemctl is-active node-dash node-dash-update.timer
          sudo test -x /var/lib/node-dash/node-dash.previous
          curl -fsS http://127.0.0.1:8080/api/status | grep -q '"autoUpdate":{[^}]*"result":"updated"'

          # A release that doesn't start: the previous binary goes back.
          printf '#!/bin/sh\n[ "$1" = version ] && echo v0.92.0 && exit 0\nexit 1\n' > broken
          chmod +x broken
          publish v0.92.0 broken
          if sudo systemctl start node-dash-update.service; then echo "a broken release must fail"; exit 1; fi
          status
          status | grep -q '"result": "failed"'
          status | grep -q "v0.92.0 didn't start within 30s; back on v0.91.0"
          test "$(node-dash version)" = v0.91.0
          systemctl is-active node-dash
          curl -fsS http://127.0.0.1:8080/healthz

          # Signed with another key: refused, nothing changes.
          build v0.93.0 newer
          publish v0.93.0 newer other.key
          if sudo systemctl start node-dash-update.service; then echo "a wrongly signed release must be refused"; exit 1; fi
          status | grep -q '"result": "refused"'
          test "$(node-dash version)" = v0.91.0

          # Off again.
          NODEDASH_AUTO_UPDATE=0 VERSION=v0.91.0 sh install.sh | tee out.txt
          grep -q 'Turning automatic updates off' out.txt
          test ! -e /etc/systemd/system/node-dash-update.timer
          test ! -e /etc/systemd/system/node-dash-update.service
          test ! -e /var/lib/node-dash
          if curl -fsS http://127.0.0.1:8080/api/status | grep -q autoUpdate; then echo "the row must be gone"; exit 1; fi
          sudo rm -r /etc/systemd/system/node-dash-update.service.d
          # This build trusts only the throwaway key, so it would refuse the
          # real releases the next step installs: those are checked with
          # minisign and the real key instead.
          sudo rm /usr/local/bin/node-dash

      - name: Uninstall
        run: |
          NODEDASH_CONTROL=1 sh install.sh >/dev/null
          sh install.sh --uninstall
          test ! -e /usr/local/bin/node-dash
          test ! -e /etc/systemd/system/node-dash.service
          test ! -e /etc/systemd/system/node-dash-update.timer
          sudo test ! -e /etc/polkit-1/rules.d/50-node-dash.rules
          test ! -e /etc/systemd/system/node-dash.service.d
          if systemctl is-active --quiet node-dash; then echo "service still running"; exit 1; fi
          test -d /home/bitcoin/.bitcoin
