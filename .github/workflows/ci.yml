name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build frontend
        run: make web

      - name: Lint
        run: make lint

      - name: Test
        run: go test -race ./...

      - name: Build binary
        run: go build -trimpath -o bin/node-dash ./cmd/node-dash

  # install.sh on a real systemd host: install an older release, update,
  # re-run (no-op), keep a changed unit, node control, automatic updates,
  # uninstall. A fake
  # bitcoind service (perl renaming itself) lets the script detect the user and
  # data directory, and the dashboard restart it.
  install-script:
    runs-on: ubuntu-latest
    # A question that waits for an answer must fail the job, not hang it.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        run: shellcheck install.sh

      - name: Fake bitcoind
        run: |
          sudo useradd --create-home bitcoin
          sudo -u bitcoin mkdir -p /home/bitcoin/.bitcoin
          # A copy of perl named bitcoind: the process is called bitcoind
          # (/proc/<pid>/comm), like the real one.
          sudo cp "$(command -v perl)" /usr/local/bin/bitcoind
          printf '%s\n' '[Service]' 'User=bitcoin' 'Restart=always' \
            'ExecStart=/usr/local/bin/bitcoind -e "sleep 3600" -- -datadir=/home/bitcoin/.bitcoin -rpcpassword=hunter2' |
            sudo tee /etc/systemd/system/bitcoind.service
          sudo systemctl daemon-reload
          sudo systemctl start bitcoind
          sleep 1
          ps -eo uid=,args= | grep '[b]itcoind'

      - name: Install an older release
        run: |
          VERSION=v0.1.0 sh install.sh
          test "$(node-dash version)" = v0.1.0
          systemctl is-active node-dash
          grep -x 'User=bitcoin' /etc/systemd/system/node-dash.service
          grep -x 'Environment=BITCOIN_DATADIR=/home/bitcoin/.bitcoin' /etc/systemd/system/node-dash.service
          curl -fsS http://127.0.0.1:8080/healthz

      - name: Update to the latest release
        run: |
          latest=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/${{ github.repository }}/releases/latest)
          latest=${latest##*/}
          sh install.sh | tee out.txt
          grep -q "Updating node-dash v0.1.0 → $latest" out.txt
          test "$(node-dash version)" = "$latest"
          systemctl is-active node-dash

      - name: Running again changes nothing
        run: |
          sh install.sh | tee out.txt
          grep -q 'already installed and up to date' out.txt

      - name: A changed unit is kept
        run: |
          sudo sed -i 's/^RestartSec=5$/RestartSec=7/' /etc/systemd/system/node-dash.service
          VERSION=v0.1.0 sh install.sh | tee out.txt
          grep -q 'Kept /etc/systemd/system/node-dash.service' out.txt
          grep -x 'RestartSec=7' /etc/systemd/system/node-dash.service
          test "$(node-dash version)" = v0.1.0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Node control
        run: |
          command -v pkaction || { sudo apt-get update && sudo apt-get install -y polkitd; }
          NODEDASH_CONTROL=1 sh install.sh | tee out.txt
          grep -q 'Node control is on' out.txt
          grep -q 'TimeoutStopSec=600' out.txt  # the fake unit has systemd's default of 90 s
          sudo grep -q 'subject.user === "bitcoin"' /etc/polkit-1/rules.d/50-node-dash.rules
          systemctl show -p Environment --value node-dash | grep -q 'NODEDASH_CONTROL=1'

          # The released binary predates node control: run this commit's build.
          mkdir -p web/dist && touch web/dist/index.html
          go build -o node-dash ./cmd/node-dash
          sudo install -m 0755 node-dash /usr/local/bin/node-dash
          sudo systemctl restart node-dash
          for _ in $(seq 10); do curl -fsS -o /dev/null http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/control | tee state.json; echo
          grep -q '"activeState":"active"' state.json

          post() {
            curl -s -o /dev/null -w '%{http_code}' -X POST "$@" http://127.0.0.1:8080/api/control
          }
          before=$(systemctl show -p MainPID --value bitcoind)
          # Refused: another site, and a plain form post.
          test "$(post -H 'Content-Type: application/json' -H 'Origin: http://evil.example' -d '{"action":"restart"}')" = 403
          test "$(post -d 'action=restart')" = 415
          sleep 2
          test "$(systemctl show -p MainPID --value bitcoind)" = "$before"

          # Accepted: systemd (allowed by polkit) restarts bitcoind.
          test "$(post -H 'Content-Type: application/json' -H 'Origin: http://127.0.0.1:8080' -d '{"action":"restart"}')" = 202
          for _ in $(seq 20); do
            after=$(systemctl show -p MainPID --value bitcoind)
            [ "$after" != "$before" ] && [ "$after" != 0 ] && systemctl is-active --quiet bitcoind && break
            sleep 1
          done
          test "$after" != "$before"
          systemctl is-active bitcoind

      # Still this commit's build: the server figures must be readable under
      # the hardening of node-dash.service, also while bitcoind has no RPC.
      - name: Server details under the service hardening
        run: |
          curl -fsS http://127.0.0.1:8080/api/details >/dev/null
          sleep 5
          curl -fsS http://127.0.0.1:8080/api/details | tee details.json; echo
          python3 - <<'EOF'
          import json
          d = json.load(open("details.json"))
          s = d["server"]
          assert d["nodeError"], "the fake bitcoind has no RPC"
          assert s["memTotalBytes"] > 0 and s["uptimeSec"] > 0 and s["diskTotalBytes"] > 0, s
          assert s["cpuPercent"] is not None, s
          assert set(s["missing"]) <= {"temperature"}, s["missing"]
          print("server details ok; missing:", s["missing"])
          EOF

      # Changing settings (story #55, decision 0003): the drop-in gives
      # write access to bitcoin.conf only; a save is backed up, refused
      # cross-site and on a conflict, and needs a restart of bitcoind.
      - name: Changing settings
        run: |
          set -eu
          conf=/home/bitcoin/.bitcoin/bitcoin.conf
          printf '%s\n' '# fake node' 'server=1' 'rpcuser=alice' 'rpcpassword=hunter2' 'dbcache=450' '' '[main]' 'maxmempool=300' |
            sudo -u bitcoin tee "$conf" >/dev/null
          sudo chmod 600 "$conf"
          sudo cp "$conf" before.conf

          NODEDASH_SETTINGS=1 sh install.sh | tee out.txt
          grep -q 'Changing settings: node-dash (user bitcoin) may write /home/bitcoin/.bitcoin/bitcoin.conf' out.txt
          grep -qx "ReadWritePaths=$conf" /etc/systemd/system/node-dash.service.d/settings.conf
          systemctl show -p Environment --value node-dash | grep -q 'NODEDASH_SETTINGS=1'

          # The release predates the form: run this commit's build.
          sudo install -m 0755 node-dash /usr/local/bin/node-dash
          sudo systemctl restart node-dash
          for _ in $(seq 10); do curl -fsS -o /dev/null http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/settings | tee form.json; echo
          if grep -q '"error":' form.json; then echo "the form must be able to save"; exit 1; fi
          if grep -q hunter2 form.json; then echo "a secret left the server"; exit 1; fi
          hash=$(python3 -c 'import json; print(json.load(open("form.json"))["hash"])')

          post() {
            curl -s -o resp.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' "$@" http://127.0.0.1:8080/api/settings
          }
          # Refused: another site.
          test "$(post -H 'Origin: http://evil.example' -d "{\"hash\":\"$hash\",\"changes\":{\"dbcache\":1000}}")" = 403
          sudo cmp "$conf" before.conf

          # Saved: edited in place, owner and mode kept, the rest byte for byte.
          test "$(post -H 'Origin: http://127.0.0.1:8080' -d "{\"hash\":\"$hash\",\"changes\":{\"dbcache\":1000,\"maxmempool\":500,\"txindex\":1}}")" = 200
          sudo cat "$conf"
          printf '%s\n' '# fake node' 'server=1' 'rpcuser=alice' 'rpcpassword=hunter2' 'dbcache=1000' '' '# Set by node-dash' 'txindex=1' '' '[main]' 'maxmempool=500' > want.conf
          sudo cmp "$conf" want.conf
          test "$(sudo stat -c '%U %a' "$conf")" = 'bitcoin 600'

          # The backup: the previous file, only for the dashboard's user.
          backup=$(sudo find /var/lib/node-dash-settings/backups -name 'bitcoin.conf.*')
          test "$(printf '%s\n' "$backup" | wc -l)" = 1
          sudo cmp "$backup" before.conf
          test "$(sudo stat -c '%U %a' "$backup")" = 'bitcoin 600'
          test "$(sudo stat -c '%a' /var/lib/node-dash-settings)" = 700
          journalctl -u node-dash --no-pager | grep 'settings saved: dbcache 450 → 1000, maxmempool 300 → 500, txindex unset → 1'
          if journalctl -u node-dash --no-pager | grep -q hunter2; then echo "a secret in the log"; exit 1; fi

          # Refused: the file changed since the form read it.
          test "$(post -d "{\"hash\":\"$hash\",\"changes\":{\"dbcache\":2000}}")" = 409
          grep -q '"conflict":true' resp.json

          # Restart needed until bitcoind has restarted (node control is on).
          curl -fsS http://127.0.0.1:8080/api/settings | grep -q '"restartNeeded":true'
          before=$(systemctl show -p MainPID --value bitcoind)
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"action":"restart"}' http://127.0.0.1:8080/api/control >/dev/null
          for _ in $(seq 20); do
            after=$(systemctl show -p MainPID --value bitcoind)
            [ "$after" != "$before" ] && [ "$after" != 0 ] && systemctl is-active --quiet bitcoind && break
            sleep 1
          done
          test "$after" != "$before"
          curl -fsS http://127.0.0.1:8080/api/settings | tee form.json; echo
          grep -q '"saved":null' form.json

          # Off again: the drop-in goes, the backups stay.
          NODEDASH_SETTINGS=0 sh install.sh | tee out.txt
          grep -q 'Turning changing settings off' out.txt
          test ! -e /etc/systemd/system/node-dash.service.d/settings.conf
          sudo test -n "$(sudo ls /var/lib/node-dash-settings/backups)"

      # The dashboard settings page (story #61, decision 0004): a switch
      # turned off there stays off after a restart, until the installer
      # turns it on again. Still this commit's build, with node control on.
      - name: Dashboard settings page
        run: |
          set -eu
          wait_up() {
            for _ in $(seq 10); do curl -fsS -o /dev/null http://127.0.0.1:8080/healthz && return 0; sleep 1; done
            return 1
          }
          # The unit was changed above, so the installer keeps it, and says
          # what the page needs.
          NODEDASH_CONTROL=1 sh install.sh | tee out.txt
          grep -q 'StateDirectory=node-dash-web' out.txt
          sudo mkdir -p /etc/systemd/system/node-dash.service.d
          printf '%s\n' '[Service]' 'StateDirectory=node-dash-web' 'StateDirectoryMode=0700' |
            sudo tee /etc/systemd/system/node-dash.service.d/web.conf
          sudo systemctl daemon-reload
          sudo install -m 0755 node-dash /usr/local/bin/node-dash
          sudo systemctl restart node-dash
          wait_up
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/control)" = 200
          curl -fsS http://127.0.0.1:8080/api/dashboard | tee web.json; echo
          grep -q '"canSave":true' web.json
          version=$(python3 -c 'import json; print(json.load(open("web.json"))["version"])')

          post() {
            curl -s -o resp.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' "$@" http://127.0.0.1:8080/api/dashboard
          }
          # Refused: another site, and turning a switch on.
          test "$(post -H 'Origin: http://evil.example' -d "{\"version\":\"$version\",\"off\":[\"control\"]}")" = 403
          test "$(post -d "{\"version\":\"$version\",\"on\":[\"control\"]}")" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/control)" = 200

          # Turned off: at once, logged, and only for the dashboard's user.
          test "$(post -H 'Origin: http://127.0.0.1:8080' -d "{\"version\":\"$version\",\"off\":[\"control\"]}")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/control)" = 404
          test "$(sudo stat -c '%U %a' /var/lib/node-dash-web)" = 'bitcoin 700'
          test "$(sudo stat -c '%U %a' /var/lib/node-dash-web/off/control)" = 'bitcoin 600'
          journalctl -u node-dash --no-pager | grep -q 'dashboard settings: Node control turned off'

          # Still off after a restart of node-dash.
          sudo systemctl restart node-dash
          wait_up
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/control)" = 404
          sh install.sh --check > check.txt
          grep -q 'node control       off (turned off on the dashboard settings page)' check.txt

          # The installer turns it on again.
          NODEDASH_CONTROL=1 sh install.sh | tee out.txt
          grep -q 'Turned node control on again' out.txt
          sudo test ! -e /var/lib/node-dash-web/off/control
          wait_up
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/control)" = 200

          # Peer addresses: an installer option with a drop-in. Five restarts
          # in a few seconds hit systemd's start limit; a person doesn't.
          sudo systemctl reset-failed node-dash
          sh install.sh --peer-addresses | tee out.txt
          grep -qx 'Environment=NODEDASH_PEER_ADDRESSES=1' /etc/systemd/system/node-dash.service.d/peers.conf
          grep -q 'peer addresses     on' out.txt
          sh install.sh --no-peer-addresses
          test ! -e /etc/systemd/system/node-dash.service.d/peers.conf
          sudo rm /etc/systemd/system/node-dash.service.d/web.conf
          sudo systemctl daemon-reload

      - name: Node control off again
        run: |
          NODEDASH_CONTROL=0 sh install.sh | tee out.txt
          grep -q 'Turning node control off' out.txt
          sudo test ! -e /etc/polkit-1/rules.d/50-node-dash.rules
          test ! -e /etc/systemd/system/node-dash.service.d/control.conf
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/control)" = 404

      # Automatic updates (story #50), from a fake release server on this
      # runner: this commit's build as v0.90.0 and v0.91.0, a v0.92.0 that
      # doesn't start, and a v0.93.0 signed with another key. The test
      # binaries carry a throwaway release key instead of the real one.
      # --check (story #63): a report that is safe to paste in a chat. The
      # fake bitcoind has rpcpassword on its command line, and bitcoin.conf
      # has it too (from "Changing settings").
      - name: The check shows no secrets
        run: |
          set -eu
          sudo grep -q hunter2 /home/bitcoin/.bitcoin/bitcoin.conf
          sh install.sh --check | tee check.txt
          sudo sh install.sh --check | tee -a check.txt
          if grep -q hunter2 check.txt; then echo "a secret in the check"; exit 1; fi
          if grep -q 'rpcuser\|alice' check.txt; then echo "a line of bitcoin.conf in the check"; exit 1; fi
          grep -q 'Safe to share' check.txt
          grep -q 'Bitcoin Core:  running, service bitcoind.service is active' check.txt
          grep -q 'user          bitcoin' check.txt
          grep -q 'bitcoin.conf  /home/bitcoin/.bitcoin/bitcoin.conf, owner bitcoin, mode 600' check.txt
          grep -q 'RPC           no answer on 127.0.0.1:8332 (chain: main)' check.txt
          grep -q 'answers       yes, on port 8080' check.txt
          grep -q 'node control       off' check.txt

      - name: Automatic updates
        run: |
          set -eu
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign >/dev/null
          minisign -G -W -s ci.key -p ci.pub
          minisign -G -W -s other.key -p other.pub
          key=$(sed -n 2p ci.pub)
          build() {
            go build -ldflags "-X main.version=$1 -X github.com/mvanasseldonk/bitcoin-node-dash/internal/minisign.releaseKey=$key" \
              -o "$2" ./cmd/node-dash
          }
          # publish TAG BINARY [SIGNING KEY]: a release, and make it the latest.
          publish() {
            name=node-dash_$1_linux_amd64
            mkdir -p "srv/download/$1" "pkg/$name" srv/api
            cp "$2" "pkg/$name/node-dash"
            tar -czf "srv/download/$1/$name.tar.gz" -C pkg "$name"
            (cd "srv/download/$1" && sha256sum "$name.tar.gz" > checksums.txt)
            minisign -S -l -s "${3:-ci.key}" -m "srv/download/$1/checksums.txt" -t "node-dash $1"
            printf '{"tag_name":"%s"}\n' "$1" > srv/api/latest
          }
          status() { sudo cat /var/lib/node-dash/update.json; }

          build v0.90.0 old
          build v0.91.0 new
          publish v0.91.0 new
          python3 -m http.server --directory srv 8999 >/dev/null 2>&1 &
          sudo install -m 0755 old /usr/local/bin/node-dash
          sudo systemctl restart node-dash
          for _ in $(seq 10); do curl -fsS -o /dev/null http://127.0.0.1:8080/healthz && break; sleep 1; done
          sudo mkdir -p /etc/systemd/system/node-dash-update.service.d
          printf '%s\n' '[Service]' \
            'Environment=NODEDASH_UPDATE_API=http://127.0.0.1:8999/api/latest' \
            'Environment=NODEDASH_UPDATE_DOWNLOADS=http://127.0.0.1:8999/download' |
            sudo tee /etc/systemd/system/node-dash-update.service.d/ci.conf

          # Turning it on checks right away: v0.90.0 → v0.91.0.
          NODEDASH_AUTO_UPDATE=1 VERSION=v0.90.0 sh install.sh | tee out.txt
          grep -q 'Automatic updates are on' out.txt
          grep -q 'First check: updated' out.txt
          test "$(node-dash version)" = v0.91.0
          systemctl is-active node-dash node-dash-update.timer
          sudo test -x /var/lib/node-dash/node-dash.previous
          curl -fsS http://127.0.0.1:8080/api/status | grep -q '"autoUpdate":{[^}]*"result":"updated"'

          # A release that doesn't start: the previous binary goes back.
          printf '#!/bin/sh\n[ "$1" = version ] && echo v0.92.0 && exit 0\nexit 1\n' > broken
          chmod +x broken
          publish v0.92.0 broken
          if sudo systemctl start node-dash-update.service; then echo "a broken release must fail"; exit 1; fi
          status
          status | grep -q '"result": "failed"'
          status | grep -q "v0.92.0 didn't start within 30s; back on v0.91.0"
          test "$(node-dash version)" = v0.91.0
          systemctl is-active node-dash
          curl -fsS http://127.0.0.1:8080/healthz

          # Signed with another key: refused, nothing changes.
          build v0.93.0 newer
          publish v0.93.0 newer other.key
          if sudo systemctl start node-dash-update.service; then echo "a wrongly signed release must be refused"; exit 1; fi
          status | grep -q '"result": "refused"'
          test "$(node-dash version)" = v0.91.0

          # Off again.
          NODEDASH_AUTO_UPDATE=0 VERSION=v0.91.0 sh install.sh | tee out.txt
          grep -q 'Turning automatic updates off' out.txt
          test ! -e /etc/systemd/system/node-dash-update.timer
          test ! -e /etc/systemd/system/node-dash-update.service
          test ! -e /var/lib/node-dash
          if curl -fsS http://127.0.0.1:8080/api/status | grep -q autoUpdate; then echo "the row must be gone"; exit 1; fi
          sudo rm -r /etc/systemd/system/node-dash-update.service.d
          # This build trusts only the throwaway key, so it would refuse the
          # real releases the next step installs: those are checked with
          # minisign and the real key instead.
          sudo rm /usr/local/bin/node-dash

      - name: Uninstall
        run: |
          NODEDASH_CONTROL=1 sh install.sh >/dev/null
          sh install.sh --uninstall
          test ! -e /usr/local/bin/node-dash
          test ! -e /etc/systemd/system/node-dash.service
          test ! -e /etc/systemd/system/node-dash-update.timer
          sudo test ! -e /etc/polkit-1/rules.d/50-node-dash.rules
          test ! -e /etc/systemd/system/node-dash.service.d
          sudo test ! -e /var/lib/node-dash-web
          if systemctl is-active --quiet node-dash; then echo "service still running"; exit 1; fi
          test -d /home/bitcoin/.bitcoin

      # The questions on a first install (story #63), in a terminal made by
      # script(1), with the answers typed in: a name, node control yes,
      # changing settings no, automatic updates no.
      - name: Questions on a first install
        run: |
          set -eu
          printf '%s\n' 'CI node' y n n | script -qec 'sh install.sh' /dev/null | tee out.txt
          grep -q 'A few questions' out.txt
          grep -q 'Node control is on' out.txt
          grep -qx 'Environment="NODEDASH_NAME=CI node"' /etc/systemd/system/node-dash.service.d/name.conf
          test -e /etc/systemd/system/node-dash.service.d/control.conf
          test ! -e /etc/systemd/system/node-dash.service.d/settings.conf
          test ! -e /etc/systemd/system/node-dash-update.timer
          curl -fsS http://127.0.0.1:8080/manifest.webmanifest | python3 -c 'import json, sys; assert json.load(sys.stdin)["name"] == "CI node"'
          grep -q 'node control       on' out.txt

          # An update asks nothing.
          script -qec 'sh install.sh' /dev/null </dev/null | tee out.txt
          if grep -q 'A few questions' out.txt; then echo "asked on an update"; exit 1; fi

      - name: Options as arguments
        run: |
          set -eu
          name='Satoshi'"'"'s "node" 100% \ ok'
          sh install.sh --name "$name" --no-control | tee out.txt
          curl -fsS http://127.0.0.1:8080/manifest.webmanifest | python3 -c 'import json, sys; assert json.load(sys.stdin)["name"] == sys.argv[1], sys.argv[1]' "$name"
          test ! -e /etc/systemd/system/node-dash.service.d/control.conf
          grep -q 'node control       off' out.txt
          grep -qF "name               $name" out.txt

          # The same again changes nothing.
          sh install.sh --name "$name" | tee out.txt
          grep -q 'already installed and up to date' out.txt

          # Back to the default name.
          sh install.sh --name ""
          test ! -e /etc/systemd/system/node-dash.service.d/name.conf
          curl -fsS http://127.0.0.1:8080/manifest.webmanifest | python3 -c 'import json, sys; assert json.load(sys.stdin)["name"] == "Node"'

          # Refused, with the reason, and nothing changed.
          if sh install.sh --name "$(printf 'x%.0s' $(seq 41))" 2>err.txt; then exit 1; fi
          grep -q 'at most 40 fit' err.txt
          if sh install.sh --bogus 2>err.txt; then exit 1; fi
          grep -q 'unknown option: --bogus' err.txt
          sh install.sh --help | grep -q -- '--auto-update'

          sh install.sh --uninstall
          test ! -e /etc/systemd/system/node-dash.service.d
